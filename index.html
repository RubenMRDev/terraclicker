  <body>
    <!--
      THESIS: el bioma no es una ilustracion dentro de una caja, es la pantalla.
      Refusa el panel-dashboard de tarjetas apiladas con scroll que tenia antes.
      OWN-WORLD: sprites de Terraria sin suavizar sobre el fondo de bioma a
      sangre; placas de piedra translucidas con borde superior del color del
      bioma activo (--accent), tipografia Baloo 2 en 800 para cifras, oro #ffd35c
      como unico acento de marca.
      STORY: el jugador ve donde esta y a que le esta pegando sin leer nada, y
      todo lo demas (fabricar, pueblo, eventos) se le pone delante y se le quita.
      FIRST VIEWPORT: fondo de bioma completo con vineta; objetivo al centro con
      su barra de vida; placa de personaje arriba a la izquierda; monedas,
      equipo y rail de pantallas a la derecha; dique de 16 zonas abajo. El clic
      primario es toda la pantalla.
      FORM: El Cartel de Bioma, primero de mi lista ordenada; seed 335ba206.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, DESIGN.md, and every shipping raster carrying
      its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
